<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des utilisateurs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         :root {
            --gold: #d4af37;
            --gold-soft: #f5e6a8;
            --black: #020617;
            --black-light: #0f172a;
            --white: #ffffff;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--black), var(--black-light));
            color: var(--white);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        /* CONTAINER */
        
        .container {
            max-width: 700px;
            margin: auto;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 18px;
            padding: 2rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6);
        }
        /* HEADER */
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .header h2 {
            color: var(--gold);
            font-size: 1.4rem;
            letter-spacing: 1px;
        }
        
        .back-link {
            text-decoration: none;
            color: var(--black);
            background: linear-gradient(135deg, var(--gold), #b8962e);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.4);
        }
        /* LISTE */
        
        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        
        li {
            background: #020617;
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 12px;
            transition: background 0.2s, transform 0.2s;
        }
        
        li:hover {
            background: rgba(212, 175, 55, 0.08);
            transform: translateX(4px);
        }
        
        li a {
            display: block;
            padding: 0.8rem 1rem;
            text-decoration: none;
            color: var(--gold-soft);
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        li a:hover {
            color: var(--gold);
        }
        /* RESPONSIVE */
        
        @media (max-width: 500px) {
            .container {
                padding: 1.5rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h2>Liste des utilisateurs</h2>
            <a href="{% url 'accueil' %}" class="back-link">← Retour à l’accueil</a>
        </div>

        <ul>
            {% for user in users %}
            <li>
                <a href="{% url 'userrapport' user.id %}">
                        {{ user.username }}
                    </a>
            </li>
            {% empty %}
            <li style="padding: 1rem; color: #94a3b8;">
                Aucun utilisateur trouvé.
            </li>
            {% endfor %}
        </ul>
    </div>

</body>

</html>
